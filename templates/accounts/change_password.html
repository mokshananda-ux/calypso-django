{% extends 'base.html' %}

{% block content %}
  
<!-- ========================= SECTION CONTENT ========================= -->
<section class="section-conten padding-y bg">

{% include 'includes/alerts.html' %}
<div class="container">

	<div class="row">
	{% include 'includes/dashboard_sidebar.html' %}
	<main class="col-md-9">
		<article class="card">
		<header class="card-header">
			<strong class="d-inline-block mr-3">Cambiar Contraseña:</strong>
			
		</header>
		<div class="card-body">
			
            <div class="row">			
			
				<div class="col-md-12">
                    <form method="post" action="{% url 'change_password' %}">
                        {% csrf_token %}
                        
                            <div class="form-group">
                                <label >Contraseña Actual</label>
                                <input type="password" class="form-control" name="current_password" placeholder="Contraseña Actual" required>
                            </div>
                            <div class="form-group">
                                <label>Nueva Contraseña</label>
                                <input type="password" class="form-control" name="new_password" placeholder="Nueva Contraseña" required>
                            </div>
                            <div class="form-group">
                                <label>Confirmar Nueva Contraseña</label>
                                <input type="password" class="form-control" name="confirm_password" placeholder="Confirmar Nueva Contraseña" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>

				</div>
			</div> <!-- row.// -->
		</div>
	</main>
	</div> <!-- col.// -->
	</div> <!-- row.// -->
</div>


</section>
<!-- ========================= SECTION CONTENT END// ========================= -->


{% endblock %}
