{% extends 'base.html' %}


{% block content %}

<!-- ============================ COMPONENT LOGIN   ================================= -->
	 




    <div class="card mx-auto" style="max-width: 380px; margin-top:100px;">
      <div class="card-body">
      <h4 class="card-title mb-4">¿Olvidaste tu contraseña?</h4>
      
      {% include 'includes/alerts.html' %}

      <form action="{% url 'forgotPassword' %}" method="POST">
          {% csrf_token %}

          <div class="form-group">
                <input type="email" class="form-control" placeholder="Correo electrónico" name="email">
          </div> <!-- form-group// -->

          <div class="form-group form-check">
			 <a href="{% url 'login' %}" class="float-right">¿Tienes otra cuenta? Inicia sesión</a> 
           </div> <!-- form-group form-check .// -->

          </div> <!-- form-group form-check .// -->
          <div class="form-group">
              <button type="submit" class="btn btn-primary btn-block"> Recuperar contraseña  </button>
          </div> <!-- form-group// -->    
      </form>
      </div> <!-- card-body.// -->
    </div> <!-- card .// -->

     <p class="text-center mt-4">¿No tienes una cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
     <br><br>
<!-- ============================ COMPONENT LOGIN  END.// ================================= -->


</section>
<!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock %}
