{% extends 'base.html'%}
{% load static %}

{% block content %}

<section class="section-content padding-y bg">
<div class="container">

<!-- ============================ COMPONENT 1 ================================= -->


<div class="row">
	<aside class="col-lg-6">
    <div class="card">
        <div class="card-body">
        <h4 class="card-title mb-4">Información de Facturación</h4>
        <form action="{% url 'place_order' %}" method= "POST">

            {% csrf_token %}

            <div class="form-row">
                <div class="col form-group">
                    <label for="">Nombre(s)</label>
                        <input type= "text" name="first_name" class= "form-control" value="{{ user_form.first_name.value|default:'' }}" required>
                </div>
                <div class="col form-group">
                    <label for="">Apellido(s)</label>
                        <input type= "text" name="last_name" class= "form-control" value="{{ user_form.last_name.value|default:'' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="">Email</label>
                        <input type= "email" name="email" class= "form-control" value="{{ user_form.email.value|default:'' }}" required>
                </div>
                <div class="col form-group">
                    <label for="">Número de Teléfono</label>
                        <input type= "text" name="phone" class= "form-control" value="{{ user_form.phone_number.value|default:'' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="">Dirección Completa (Calle, Número Ext/Int, Colonia/Fraccionamiento/Sección)</label>
                        <input type= "text" name="address_line_1" class= "form-control" value="{{ profile_form.address_line_1.value|default:'' }}" required>
                </div>

            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="">Municipio/Delegación</label>
                        <input type= "text" name="city" class= "form-control" value="{{ profile_form.city.value|default:'' }}" required>
                </div>
                <div class="col form-group">
                    <label for="">Estado/Ciudad</label>
                        <input type= "text" name="state" class= "form-control" value="{{ profile_form.state.value|default:'' }}" required>
                </div>
                <div class="col form-group">
                    <label for="">Código Postal</label>
                        <input type= "text" name="zip_code" class= "form-control" value="{{ profile_form.zip_code.value|default:'' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="">Nota del Pedido</label>
                    <textarea name="order_note" rows="2" class= "form-control">{{ order_note }}</textarea>
                </div>
           </div>
        </div>
    </div> <!-- card.// -->
    </aside> <!-- col.// -->

    <aside class="col-lg-6">

		<div class="card">
		    <div class="card-body">


        <table class="table table-borderless table-shopping-cart">

        <thead class="text-muted">
            <tr class="small text-uppercase">
                <th scope="col">Producto</th>
                <th scope="col" width="120">Precio</th>
            </tr>
        </thead>

        <tbody>

            {% for cart_item in cart_items %}
            <tr>
            <td>
                <figure class="itemside align-items-center">
                    <div class="aside"><img src="{% if cart_item.product.image %}{{ cart_item.product.image.url }}{% else %}{% static 'images/items/1.jpg' %}{% endif %}" class="img-sm" alt="{{ cart_item.product.name }}"></div>
                    <figcaption class="info">
                        <a href="{{ cart_item.product.get_url }}" class="title text-dark">{{ cart_item.product.name }}</a>
                        <p class="text-muted small">Matrix: 25 Mpx <br> Brand: {{ cart_item.product.brand }}</p>
                    </figcaption>
                </figure>
            </td>

            <td>
                <div class="price-wrap">
                    <var class="price">${{ cart_item.product.price|floatformat:2 }}</var>

                </div> <!-- price-wrap.// -->
            </td>
            </tr>
            {% endfor %}

        </tbody>
        </table>



            <button type="submit" name="submit" class="btn btn-primary btn-block" onclick="return confirm('¿Estás seguro de que quieres realizar esta compra?');"> Realizar Pedido </button>
            <a href="{% url 'store' %}" class="btn btn-light btn-block">Continuar Comprando</a>


</div> <!-- card-body.// -->
</div> <!-- card.// -->

</aside> <!-- col.// -->


</div> <!-- row.// -->


<!-- ============================ COMPONENT 1 END .// ================================= -->

</div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock %}
